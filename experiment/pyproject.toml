[project]
name = "fyp-interaction-experiments"
version = "0.1.0"
description = "Matched multi-round Text-to-SQL interaction experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.28.0,<3",
    "python-dotenv>=1.2.2,<2",
    "sqlglot==26.16.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
